# QwenPI full-finetuning configuration for the 36-D EgoS2 action contract.
run_id: egos2_adamu_qwenpi
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_EgoS2
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI
  qwenvl:
    base_vlm: /sharedata/pretrained/mllm/Qwen/Qwen3.5-2B
    attn_implementation: sdpa
    enable_gradient_checkpointing: true
  action_model:
    action_model_type: LayerwiseFM
    action_dim: 36
    state_dim: 36
    action_horizon: 16
    repeated_diffusion_steps: 2
    num_inference_timesteps: 4
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 32
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    diffusion_model_cfg:
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
      attention_head_dim: 64

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /path/to/egos2_dataset_parent
    data_mix: EgoS2_Adamu_Open
    robot_type: EgoS2_Adamu
    lerobot_version: v2.0
    action_type: EgoS2_delta_eef_abs_hand
    action_mode: abs
    action_horizon: 16
    sequential_step_sampling: false
    per_device_batch_size: 1
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: pyav
    num_workers: 2
    persistent_workers: true
    mirror_augmentation:
      enabled: false
      probability: 0.5
      seed: 42
    overfit:
      enabled: false
      num_samples: 0

trainer:
  # The launcher enforces the one-hour wall-clock budget.  This high ceiling
  # prevents max_train_steps from ending the run early on faster 4-GPU hosts.
  max_train_steps: 1000000
  num_warmup_steps: 200
  save_interval: 100
  eval_interval: 1000001
  learning_rate:
    base: 5.0e-06
    qwen_vl_interface: 5.0e-06
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  save_format: pt
  loss_spike:
    enabled: true
    warmup_steps: 20
    ratio_threshold: 4.0
    ema_decay: 0.98
    top_k: 8
  overfit:
    enabled: false
    log_every: 1
    target_ratio: 0.1
